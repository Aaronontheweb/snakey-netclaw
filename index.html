<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Snakey — Classic Snake</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --grid: #334155;
    --snake: #22c55e;
    --snake-head: #16a34a;
    --food: #ef4444;
    --text: #e2e8f0;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 20px;
  }
  h1 { font-size: 2rem; letter-spacing: 1px; }
  h1 span { color: var(--accent); }
  #score-box {
    font-size: 1.2rem;
    background: var(--panel);
    padding: 8px 20px;
    border-radius: 999px;
    box-shadow: 0 4px 12px rgba(0,0,0,.4);
  }
  #score-box b { color: var(--food); font-size: 1.4rem; }
  #game {
    position: relative;
    background: var(--panel);
    border: 2px solid var(--grid);
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
  }
  canvas { display: block; border-radius: 10px; }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(15,23,42,.82);
    border-radius: 10px;
    text-align: center;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { font-size: 1.6rem; }
  #overlay p { color: var(--text); opacity: .8; }
  .btn {
    background: var(--accent);
    color: #0f172a;
    border: none;
    font-weight: 700;
    font-size: 1rem;
    padding: 10px 28px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform .1s ease;
  }
  .btn:hover { transform: scale(1.05); }
  .hint { opacity: .6; font-size: .9rem; }
  .stem-link { margin-top: 6px; font-size: .8rem; opacity: .6; }
  .stem-link a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
  <h1>SNAKE<span>Y</span> 🐍</h1>
  <div id="score-box">Score: <b id="score">0</b></div>
  <div id="game">
    <canvas id="canvas" width="400" height="400"></canvas>
    <div id="overlay">
      <h2 id="ov-title">🐍 Snakey</h2>
      <p id="ov-msg">Use arrow keys or WASD to move. Eat the red food. Don't hit the walls or yourself.</p>
      <button class="btn" id="start-btn">Start Game</button>
    </div>
  </div>
  <div class="hint">Arrow keys / WASD &middot; Eat food to grow &middot; P to pause</div>
  <div class="stem-link">Built with <a href="https://netclaw.dev" target="_blank" rel="noopener">NetClaw</a></div>

<script>
(function () {
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ov-title');
  var ovMsg = document.getElementById('ov-msg');
  var startBtn = document.getElementById('start-btn');

  var GRID = 20;      // cells per side
  var CELL = canvas.width / GRID; // 20px

  var snake, dir, nextDir, food, score, running, paused, speed, req;

  function reset() {
    var mid = Math.floor(GRID / 2);
    snake = [{x: mid, y: mid}, {x: mid - 1, y: mid}, {x: mid - 2, y: mid}];
    dir = {x: 1, y: 0};
    nextDir = dir;
    score = 0;
    speed = 120; // ms per tick
    spawnFood();
    scoreEl.textContent = score;
  }

  function spawnFood() {
    while (true) {
      var f = {
        x: Math.floor(Math.random() * GRID),
        y: Math.floor(Math.random() * GRID)
      };
      var hit = snake.some(function (s) { return s.x === f.x && s.y === f.y; });
      if (!hit) { food = f; return; }
    }
  }

  function tick() {
    if (!running || paused) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // apply direction (prevent reversing into self)
    if (!(nextDir.x === -dir.x && nextDir.y === -dir.y)) {
      dir = nextDir;
    }

    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // wall collision -> game over
    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
      gameOver('You hit the wall!');
      return;
    }
    // self collision -> game over
    for (var i = 0; i < snake.length; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) {
        gameOver('You bit yourself!');
        return;
      }
    }

    snake.unshift(head);

    // food?
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      spawnFood();
      if (speed > 50) speed -= 3;
    } else {
      snake.pop();
    }

    draw();
    req = setTimeout(tick, speed);
  }

  function draw() {
    // grid
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(51,65,85,.35)';
    ctx.lineWidth = 1;
    for (var i = 0; i <= GRID; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL);
      ctx.lineTo(canvas.width, i * CELL);
      ctx.stroke();
    }

    // snake
    for (var j = snake.length - 1; j >= 0; j--) {
      var s = snake[j];
      ctx.fillStyle = j === 0 ? '#16a34a' : '#22c55e';
      roundRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2, 4);
      ctx.fill();
    }
    // eyes on head
    var h = snake[0];
    var ex = h.x * CELL, ey = h.y * CELL;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(ex + CELL * 0.35, ey + CELL * 0.35, 2.2, 0, Math.PI * 2);
    ctx.arc(ex + CELL * 0.65, ey + CELL * 0.35, 2.2, 0, Math.PI * 2);
    ctx.fill();

    // food
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2 - 3, food.y * CELL + CELL / 2 - 3, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function gameOver(msg) {
    running = false;
    clearTimeout(req);
    ovTitle.textContent = '💀 Game Over';
    ovMsg.textContent = msg + ' Final score: ' + score;
    startBtn.textContent = 'Play Again';
    overlay.classList.remove('hidden');
  }

  function start() {
    clearTimeout(req);
    reset();
    running = true;
    paused = false;
    overlay.classList.add('hidden');
    draw();
    req = setTimeout(tick, speed);
  }

  // input
  var keys = {
    ArrowUp: {x: 0, y: -1}, ArrowDown: {x: 0, y: 1},
    ArrowLeft: {x: -1, y: 0}, ArrowRight: {x: 1, y: 0},
    w: {x: 0, y: -1}, s: {x: 0, y: 1},
    a: {x: -1, y: 0}, d: {x: 1, y: 0},
    W: {x: 0, y: -1}, S: {x: 0, y: 1},
    A: {x: -1, y: 0}, D: {x: 1, y: 0}
  };

  document.addEventListener('keydown', function (e) {
    if (keys[e.key]) {
      e.preventDefault();
      if (running && !paused) nextDir = keys[e.key];
    } else if (e.key === 'p' || e.key === 'P') {
      if (running) {
        paused = !paused;
        if (paused) { clearTimeout(req); overlay.classList.remove('hidden'); ovTitle.textContent = '⏸ Paused'; ovMsg.textContent = 'Press P to resume'; startBtn.textContent = 'Resume'; }
        else { overlay.classList.add('hidden'); req = setTimeout(tick, speed); }
      }
    }
  });

  startBtn.addEventListener('click', start);

  // initial paint
  reset();
  draw();
})();
</script>
</body>
</html>
